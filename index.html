```html
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japko 🍎</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #japko {
            position: absolute;
            width: 180px;
            height: 180px;
            object-fit: contain;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
        }

        #start {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div id="start">🍎 KLIKNIJ, ŻEBY ZACZĄĆ 🍎</div>

    <!-- TU ZMIENIASZ OBRAZEK -->
    <img id="japko" src="japko.png" alt="Japko">

    <audio id="sound" src="dzwiek.mp3" preload="auto"></audio>

    <script>
        const japko = document.getElementById("japko");
        const start = document.getElementById("start");
        const sound = document.getElementById("sound");

        let x = Math.random() * (window.innerWidth - 180);
        let y = Math.random() * (window.innerHeight - 180);

        let speedX = 4;
        let speedY = 3;

        japko.style.left = x + "px";
        japko.style.top = y + "px";

        start.addEventListener("click", () => {
            start.style.display = "none";

            function move() {
                x += speedX;
                y += speedY;

                if (x <= 0 || x >= window.innerWidth - japko.offsetWidth) {
                    speedX *= -1;
                }

                if (y <= 0 || y >= window.innerHeight - japko.offsetHeight) {
                    speedY *= -1;
                }

                japko.style.left = x + "px";
                japko.style.top = y + "px";

                requestAnimationFrame(move);
            }

            move();
        });

        japko.addEventListener("click", () => {
            sound.currentTime = 0;
            sound.play();
        });

        window.addEventListener("resize", () => {
            x = Math.min(x, window.innerWidth - japko.offsetWidth);
            y = Math.min(y, window.innerHeight - japko.offsetHeight);
        });
    </script>

</body>
</html>
