<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAPKO 🍎</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #japko {
            position: absolute;
            width: 180px;
            height: 180px;
            object-fit: contain;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
        }

        #start {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            background: black;
            color: white;

            font-family: Arial, sans-serif;
            font-size: 28px;
            font-weight: bold;

            cursor: pointer;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="start">
        🍎 KLIKNIJ, ŻEBY URUCHOMIĆ JAPKO 🍎
    </div>

    <!-- GŁÓWNE JAPKO -->
    <img id="japko" src="JAPKO/japko.png" alt="Japko">

    <!-- Odtwarzacz dźwięku -->
    <audio id="sound"></audio>

    <script>

        // =====================================
        // 13 FILMÓW MP4 W FOLDERZE JAPKO
        // =====================================

        const filmy = [
            "JAPKO/szybkakaczka.mp4",
            "JAPKO/ajshdfhjasdbhfjasadfs.mp4",
            "JAPKO/clearmax.mp4",
            "JAPKO/duck.mp4",
            "JAPKO/freestrona.mp4",
            "JAPKO/golomb.mp4",
            "JAPKO/gratulacje.mp4",
            "JAPKO/intro.mp4",
            "JAPKO/jaczup.mp4",
            "JAPKO/kaczuszka.mp4",
            "JAPKO/mushbox.mp4",
            "JAPKO/puddi.mp4",
            "JAPKO/rickroll.mp4"
        ];


        // =====================================
        // LOSOWANIE FILMU
        // =====================================

        const losowyFilm =
            filmy[Math.floor(Math.random() * filmy.length)];

        const sound = document.getElementById("sound");

        sound.src = losowyFilm;
        sound.preload = "auto";


        // =====================================
        // JAPKO
        // =====================================

        const japko = document.getElementById("japko");

        let x = Math.random() * Math.max(1, window.innerWidth - 180);
        let y = Math.random() * Math.max(1, window.innerHeight - 180);

        let speedX = 4;
        let speedY = 3;


        // =====================================
        // RUCH JAPKA
        // =====================================

        function moveJapko() {

            x += speedX;
            y += speedY;

            if (
                x <= 0 ||
                x >= window.innerWidth - japko.offsetWidth
            ) {
                speedX *= -1;
            }

            if (
                y <= 0 ||
                y >= window.innerHeight - japko.offsetHeight
            ) {
                speedY *= -1;
            }

            japko.style.left = x + "px";
            japko.style.top = y + "px";

            requestAnimationFrame(moveJapko);
        }


        // =====================================
        // START
        // =====================================

        const start = document.getElementById("start");

        start.addEventListener("click", () => {

            start.style.display = "none";

            sound.currentTime = 0;

            sound.play().catch(error => {
                console.log("Nie udało się odtworzyć MP4:", error);
            });

            moveJapko();
        });


        // =====================================
        // KLIKNIĘCIE W JAPKO
        // =====================================

        japko.addEventListener("click", () => {

            sound.currentTime = 0;

            sound.play().catch(error => {
                console.log("Nie udało się odtworzyć MP4:", error);
            });

        });


        // =====================================
        // ZMIANA ROZMIARU OKNA
        // =====================================

        window.addEventListener("resize", () => {

            x = Math.min(
                x,
                Math.max(0, window.innerWidth - japko.offsetWidth)
            );

            y = Math.min(
                y,
                Math.max(0, window.innerHeight - japko.offsetHeight)
            );

        });

    </script>

</body>
</html>
